name: Build APK

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android SDK pieces
        run: |
          SDK="${ANDROID_HOME:-$ANDROID_SDK_ROOT}"
          yes | "$SDK/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true
          "$SDK/cmdline-tools/latest/bin/sdkmanager" "build-tools;34.0.0" "platforms;android-34"
          echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"

      - name: Build
        run: |
          chmod +x build.sh
          VERSION_NAME=7.6-thumbs ./build.sh

      - uses: actions/upload-artifact@v4
        with:
          name: hume-launcher-apk
          path: build/tvos-home.apk
